<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gadchat gateway demo</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: #fffaf2;
      --line: #d8c4a3;
      --text: #23190f;
      --muted: #7b6958;
      --accent: #b34d20;
      --accent-soft: #f6e0d3;
      --good: #2f7a46;
      --bad: #8e2c2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top, #fff8df 0%, var(--bg) 45%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0));
      font-family: "IBM Plex Sans", sans-serif;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 18px 40px;
      display: grid;
      gap: 16px;
    }

    .panel {
      display: grid;
      gap: 14px;
      padding: 18px;
      background: rgba(255, 250, 242, 0.92);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(67, 43, 23, 0.08);
    }

    h1,
    h2 {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.02em;
    }

    .field,
    .stack {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .row {
      display: grid;
      gap: 12px;
    }

    .row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    input,
    textarea,
    button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 11px 12px;
      font: inherit;
      background: white;
      color: var(--text);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
      font-family: "IBM Plex Mono", monospace;
    }

    button {
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    button.secondary {
      background: var(--accent-soft);
      color: var(--text);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status {
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .status.good {
      color: var(--good);
    }

    .status.bad {
      color: var(--bad);
    }

    .meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .response {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      min-height: 160px;
    }

    @media (max-width: 768px) {
      .row.two {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel">
      <h1>Gateway Demo</h1>
      <div class="meta">
        <div>Authorizer HTTP: <strong>http://localhost:8000</strong></div>
        <div>Gateway WebSocket: <strong>ws://localhost:8001/ws</strong></div>
      </div>
    </section>

    <section class="panel">
      <h2>Подключение пользователя</h2>
      <div class="row two">
        <div class="field">
          <label for="authUserId">User ID</label>
          <input id="authUserId" inputmode="numeric" placeholder="1" value="1" />
        </div>
        <div class="field">
          <label for="requestIdPrefix">Префикс request_id</label>
          <input id="requestIdPrefix" placeholder="demo-chat" value="demo-chat" />
        </div>
      </div>
      <div class="row two">
        <button id="connectButton" onclick="connect()">Авторизоваться и подключиться</button>
        <button class="secondary" id="disconnectButton" onclick="disconnect()" disabled>Отключиться</button>
      </div>
      <div id="authStatus" class="status">Не подключено</div>
    </section>

    <section class="panel">
      <h2>Создать чат</h2>
      <div class="row two">
        <div class="field">
          <label for="chatTitle">Название канала</label>
          <input id="chatTitle" placeholder="Например, Команда" />
        </div>
        <div class="field">
          <label for="chatUsers">Пользователи</label>
          <input id="chatUsers" placeholder="2, 3, 4" />
        </div>
      </div>
      <button id="createChatButton" onclick="createChat()" disabled>Отправить message в gateway</button>
      <div id="createChatStatus" class="status">Ожидает подключения</div>
    </section>

    <section class="panel">
      <h2>Последний отправленный Event</h2>
      <pre id="requestPreview" class="response">{}</pre>
    </section>

    <section class="panel">
      <h2>Последний полученный Event</h2>
      <pre id="responsePreview" class="response">{}</pre>
    </section>
  </div>

  <script>
    const PAGE_HOST = window.location.hostname || "localhost";
    const PAGE_PROTOCOL = window.location.protocol;
    const WS_PROTOCOL = PAGE_PROTOCOL === "https:" ? "wss:" : "ws:";
    const AUTH_BASE_URL = `${PAGE_PROTOCOL}//${PAGE_HOST}:8000`;
    const GATEWAY_WS_URL = `${WS_PROTOCOL}//${PAGE_HOST}:8001/ws`;

    let token = null;
    let socket = null;
    let currentUserId = null;
    let requestCounter = 0;

    function setStatus(id, text, tone = "") {
      const node = document.getElementById(id);
      node.textContent = text;
      node.className = `status ${tone}`.trim();
    }

    function setPreview(id, value) {
      document.getElementById(id).textContent = JSON.stringify(value, null, 2);
    }

    function splitUsers(value) {
      return value
        .split(/[,\s]+/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    async function request(url, options = {}) {
      let response;
      try {
        response = await fetch(url, options);
      } catch (error) {
        const reason = error instanceof Error ? error.message : "Network error";
        throw new Error(`${reason}: ${url}`);
      }
      if (!response.ok) {
        throw new Error(await response.text() || `${response.status}`);
      }
      const contentType = response.headers.get("content-type") || "";
      if (contentType.includes("application/json")) {
        return await response.json();
      }
      return await response.text();
    }

    function updateButtons() {
      const connected = Boolean(socket) && socket.readyState === WebSocket.OPEN;
      document.getElementById("connectButton").disabled = connected;
      document.getElementById("disconnectButton").disabled = !socket;
      document.getElementById("createChatButton").disabled = !connected;
    }

    function nextRequestId() {
      requestCounter += 1;
      const prefix = document.getElementById("requestIdPrefix").value.trim() || "demo-chat";
      return `${prefix}-${requestCounter}`;
    }

    async function connect() {
      const userId = document.getElementById("authUserId").value.trim();
      if (!userId) {
        setStatus("authStatus", "Укажите user_id", "bad");
        return;
      }

      try {
        const auth = await request(`${AUTH_BASE_URL}/api/users:auth`, {
          method: "POST",
          headers: { "x-user-id": userId },
        });

        token = auth.token;
        currentUserId = userId;

        if (socket) {
          socket.close();
        }

        socket = new WebSocket(`${GATEWAY_WS_URL}?token=${encodeURIComponent(token)}`);

        socket.onopen = () => {
          setStatus("authStatus", `Подключено как ${currentUserId}`, "good");
          setStatus("createChatStatus", "Соединение с gateway установлено", "good");
          updateButtons();
        };

        socket.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);
            setPreview("responsePreview", payload);
            setStatus("createChatStatus", `Получен ${payload.kind}:${payload.status}`, "good");
          } catch (_error) {
            setPreview("responsePreview", event.data);
          }
        };

        socket.onerror = () => {
          setStatus("authStatus", "Ошибка WebSocket соединения", "bad");
          setStatus("createChatStatus", "Gateway websocket error", "bad");
          updateButtons();
        };

        socket.onclose = () => {
          socket = null;
          updateButtons();
          setStatus("authStatus", token ? "Соединение закрыто" : "Не подключено");
        };

        updateButtons();
      } catch (error) {
        setStatus("authStatus", error instanceof Error ? error.message : "Ошибка авторизации", "bad");
      }
    }

    function disconnect() {
      token = null;
      currentUserId = null;
      if (socket) {
        socket.close();
      }
      socket = null;
      updateButtons();
      setStatus("authStatus", "Не подключено");
      setStatus("createChatStatus", "Отключено");
    }

    function createChat() {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        setStatus("createChatStatus", "Сначала подключитесь к gateway", "bad");
        return;
      }

      const title = document.getElementById("chatTitle").value.trim() || null;
      const users = splitUsers(document.getElementById("chatUsers").value);

      const event = {
        request_id: nextRequestId(),
        kind: "request",
        status: "request",
        topic: "chat.create",
        targets: {
          user_ids: [],
        },
        payload: {
          title,
          users,
        },
      };

      setPreview("requestPreview", event);
      socket.send(JSON.stringify(event));
      setStatus("createChatStatus", `Отправлен ${event.request_id}`, "");
    }

    updateButtons();
  </script>
</body>
</html>
