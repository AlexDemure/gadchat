<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>gadchat MVP</title>
  <style>
    :root {
      --bg: #f5efe3;
      --panel: #fff9ef;
      --line: #d5c5a6;
      --ink: #1f1a14;
      --accent: #c4551a;
      --accent-soft: #fde2cf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
      background: radial-gradient(circle at top, #fff7d8 0%, var(--bg) 60%);
      color: var(--ink);
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .panel {
      background: rgba(255, 249, 239, 0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(56, 34, 16, 0.08);
      backdrop-filter: blur(10px);
    }
    .sidebar, .chat {
      padding: 18px;
    }
    h1, h2 {
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.02em;
      margin: 0 0 12px;
    }
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }
    input, textarea, button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font: inherit;
      background: white;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
    }
    .secondary {
      background: var(--accent-soft);
      color: var(--ink);
    }
    .chat-list, .messages {
      display: grid;
      gap: 8px;
      max-height: 60vh;
      overflow: auto;
      padding-right: 4px;
    }
    .chat-card, .msg {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.7);
    }
    .msg.self {
      background: #fff0e5;
      border-color: #f0b086;
    }
    .meta {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .status {
      font-size: 13px;
      margin-bottom: 12px;
      min-height: 20px;
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .attach-list {
      display: grid;
      gap: 6px;
    }
    .attach-chip {
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 8px;
      background: #fff;
    }
    .media-grid {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .media-grid img {
      max-width: 260px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: block;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel sidebar">
      <h1>gadchat MVP</h1>
      <div class="field">
        <label>User ID</label>
        <input id="userId" value="user-1" />
      </div>
      <div class="field">
        <label>Direct peer user ID</label>
        <input id="peerUserId" value="user-2" />
      </div>
      <div class="field">
        <label>Image upload</label>
        <div class="upload-row">
          <input id="imageFile" type="file" accept="image/*" multiple />
          <button class="secondary" onclick="uploadFiles('image', 'imageFile')">Upload</button>
        </div>
      </div>
      <div class="field">
        <label>Video upload</label>
        <div class="upload-row">
          <input id="videoFile" type="file" accept="video/*" multiple />
          <button class="secondary" onclick="uploadFiles('video', 'videoFile')">Upload</button>
        </div>
      </div>
      <div class="field">
        <label>Audio upload</label>
        <div class="upload-row">
          <input id="audioFile" type="file" accept="audio/*" multiple />
          <button class="secondary" onclick="uploadFiles('audio', 'audioFile')">Upload</button>
        </div>
      </div>
      <div class="field">
        <label>Document upload</label>
        <div class="upload-row">
          <input id="documentFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.json,.xml,.html,.css,.js" multiple />
          <button class="secondary" onclick="uploadFiles('document', 'documentFile')">Upload</button>
        </div>
        <div class="attach-list" id="attachList"></div>
      </div>
      <div class="field">
        <label>Extra Attachments JSON</label>
        <textarea id="attachments" rows="5">[]</textarea>
      </div>
      <div class="row">
        <button onclick="connectSocket()">Connect</button>
        <button class="secondary" onclick="loadChats()">Refresh chats</button>
      </div>
      <p class="status" id="status"></p>
      <h2>Chats</h2>
      <div class="chat-list" id="chatList"></div>
    </aside>
    <main class="panel chat">
      <h2>Dialog</h2>
      <div class="row">
        <button class="secondary" onclick="loadMore('before')">Load older</button>
        <button class="secondary" onclick="loadMore('after')">Load newer</button>
      </div>
      <div style="height: 12px;"></div>
      <div class="messages" id="messages"></div>
      <div style="height: 12px;"></div>
      <div class="field">
        <label>Text</label>
        <textarea id="messageText" rows="4" placeholder="Message body"></textarea>
      </div>
      <button onclick="sendMessage()">Send</button>
    </main>
  </div>
  <script>
    let ws;
    let currentChatId = null;
    let beforeCursor = null;
    let afterCursor = null;
    let uploadedAttachments = [];
    let authToken = null;
    let authTokenUserId = null;
    const attachmentUrls = new Map();

    function status(text) {
      document.getElementById("status").textContent = text;
    }

    function resetAttachmentUrls() {
      for (const url of attachmentUrls.values()) URL.revokeObjectURL(url);
      attachmentUrls.clear();
    }

    async function authHeaders() {
      return { "x-user-id": document.getElementById("userId").value };
    }

    async function getAuthToken(force = false) {
      const userId = document.getElementById("userId").value;
      if (!force && authToken && authTokenUserId === userId) return authToken;
      const response = await fetch("/users:auth", { method: "POST", headers: await authHeaders() });
      if (!response.ok) throw new Error(await response.text());
      const payload = await response.json();
      authToken = payload.token;
      authTokenUserId = userId;
      resetAttachmentUrls();
      return authToken;
    }

    async function apiHeaders(extra = {}) {
      const token = await getAuthToken();
      return { authorization: `Bearer ${token}`, ...extra };
    }

    async function connectSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      const token = await getAuthToken(true);
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${protocol}://${location.host}/ws?token=${encodeURIComponent(token)}`);
      ws.onopen = () => status("socket connected");
      ws.onclose = () => status("socket closed");
      ws.onerror = () => status("socket error");
      ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        if (payload.event === "message.created") {
          if (payload.chat_id === currentChatId) void renderMessage(payload.message, true);
          loadChats();
        }
      };
      await loadChats();
    }

    async function loadChats() {
      const response = await fetch("/chats:search", {
        method: "POST",
        headers: await apiHeaders({ "content-type": "application/json" }),
        body: JSON.stringify({ limit: 20, text: null, cursor: null })
      });
      const chats = await response.json();
      const root = document.getElementById("chatList");
      root.innerHTML = "";
      for (const chat of chats.items) {
        const node = document.createElement("button");
        node.className = "chat-card secondary";
        node.textContent = `${chat.chat_id} | members: ${chat.members.join(", ")} | ${chat.last_message_preview || "empty"}`;
        node.onclick = () => openChat(chat.chat_id);
        root.appendChild(node);
      }
    }

    async function openChat(chatId) {
      currentChatId = chatId;
      beforeCursor = null;
      afterCursor = null;
      document.getElementById("messages").innerHTML = "";
      await fetchMessages("before");
    }

    function renderAttachmentEditor() {
      const root = document.getElementById("attachList");
      root.innerHTML = "";
      for (const attachment of uploadedAttachments) {
        const node = document.createElement("div");
        node.className = "attach-chip";
        node.textContent = `${attachment.filename || attachment.key} (${attachment.content_type || "unknown"})`;
        root.appendChild(node);
      }
    }

    async function uploadFiles(kind, inputId) {
      if (!currentChatId) {
        status("choose chat first");
        return;
      }
      const input = document.getElementById(inputId);
      const files = input.files ? Array.from(input.files) : [];
      if (!files.length) {
        status("choose files first");
        return;
      }
      let success = 0;
      for (const file of files) {
        const form = new FormData();
        form.append("file", file);
        const response = await fetch(`/chats/${currentChatId}/files:upload:${kind}`, {
          method: "POST",
          headers: await apiHeaders(),
          body: form
        });
        if (!response.ok) {
          status(`upload failed on ${file.name}: ${await response.text()}`);
          continue;
        }
        const uploaded = await response.json();
        uploadedAttachments.push(uploaded);
        success += 1;
      }
      renderAttachmentEditor();
      input.value = "";
      status(`uploaded ${success}/${files.length} ${kind}`);
    }

    async function getAttachmentUrl(chatId, fileId) {
      const key = `${chatId}:${fileId}`;
      if (attachmentUrls.has(key)) return attachmentUrls.get(key);
      const response = await fetch(`/chats/${chatId}/files/${fileId}`, {
        headers: await apiHeaders()
      });
      if (!response.ok) throw new Error(await response.text());
      const url = URL.createObjectURL(await response.blob());
      attachmentUrls.set(key, url);
      return url;
    }

    async function renderAttachment(root, chatId, attachment) {
      const contentType = attachment.content_type || "";
      const filename = attachment.filename || attachment.key || "file";
      try {
        const url = await getAttachmentUrl(chatId, attachment.id);
        if (contentType.startsWith("image/")) {
          const image = document.createElement("img");
          image.src = url;
          image.alt = filename;
          root.appendChild(image);
          return;
        }
        if (contentType.startsWith("video/")) {
          const video = document.createElement("video");
          video.controls = true;
          video.preload = "metadata";
          video.style.maxWidth = "260px";
          video.style.width = "100%";
          video.style.borderRadius = "12px";
          video.style.border = "1px solid var(--line)";
          const source = document.createElement("source");
          source.src = url;
          source.type = contentType;
          video.appendChild(source);
          root.appendChild(video);
          return;
        }
        if (contentType.startsWith("audio/")) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "metadata";
          audio.style.width = "100%";
          audio.style.maxWidth = "320px";
          const source = document.createElement("source");
          source.src = url;
          source.type = contentType;
          audio.appendChild(source);
          root.appendChild(audio);
          return;
        }
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.textContent = filename;
        root.appendChild(link);
      } catch {
        const error = document.createElement("div");
        error.textContent = `${filename} unavailable`;
        root.appendChild(error);
      }
    }

    async function renderMessage(message, append = true) {
      const userId = document.getElementById("userId").value;
      const node = document.createElement("div");
      node.className = "msg" + (message.sender_id === userId ? " self" : "");
      node.innerHTML = `<div class="meta">${message.sender_id} | ${message.created}</div><div>${message.body || ""}</div>`;
      const root = document.getElementById("messages");
      if (append) root.appendChild(node);
      else root.prepend(node);
      if (!(message.attachments || []).length) return;

      const mediaRoot = document.createElement("div");
      mediaRoot.className = "media-grid";
      node.appendChild(mediaRoot);
      for (const attachment of message.attachments || []) {
        await renderAttachment(mediaRoot, message.chat_id, attachment);
      }
    }

    async function fetchMessages(direction) {
      if (!currentChatId) return;
      const requestPayload = { direction, limit: 20, text: null };
      if (direction === "before" && beforeCursor) requestPayload.cursor = beforeCursor;
      if (direction === "after" && afterCursor) requestPayload.cursor = afterCursor;
      const response = await fetch(`/chats/${currentChatId}/messages:search`, {
        method: "POST",
        headers: await apiHeaders({ "content-type": "application/json" }),
        body: JSON.stringify(requestPayload)
      });
      const responsePayload = await response.json();
      for (const message of responsePayload.items) await renderMessage(message, direction !== "before");
      beforeCursor = responsePayload.prev_cursor;
      afterCursor = responsePayload.next_cursor;
    }

    async function loadMore(direction) {
      await fetchMessages(direction);
    }

    async function createChat(members) {
      const response = await fetch("/chats:create", {
        method: "POST",
        headers: await apiHeaders({ "content-type": "application/json" }),
        body: JSON.stringify({ members })
      });
      if (!response.ok) throw new Error(await response.text());
      return await response.json();
    }

    async function sendMessage() {
      let targetChatId = currentChatId;
      const body = document.getElementById("messageText").value;
      const peerUserId = document.getElementById("peerUserId").value;
      let extraAttachments = [];
      try {
        extraAttachments = JSON.parse(document.getElementById("attachments").value || "[]");
      } catch {
        status("attachments JSON is invalid");
        return;
      }
      const attachments = [...uploadedAttachments, ...extraAttachments];
      const payload = { body, attachments };
      if (!targetChatId) {
        if (!peerUserId) {
          status("choose chat or set peer user id");
          return;
        }
        try {
          const chat = await createChat([peerUserId]);
          targetChatId = chat.chat_id;
          currentChatId = chat.chat_id;
        } catch (error) {
          status(error instanceof Error ? error.message : "chat create failed");
          return;
        }
      }

      const response = await fetch(`/chats/${targetChatId}/messages:create`, {
        method: "POST",
        headers: await apiHeaders({ "content-type": "application/json" }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        status(await response.text());
        return;
      }
      document.getElementById("messageText").value = "";
      uploadedAttachments = [];
      renderAttachmentEditor();
      status("message accepted");
      await loadChats();
      if (targetChatId) await openChat(targetChatId);
    }
  </script>
</body>
</html>
